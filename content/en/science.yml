imaging:
  title: Gallium-68 DOTATOC PET-CT
  date: May 26, 2026
  summary: >-
    Multiple blastic bone metastases with somatostatin receptor overexpression
    (SSTR). Focal uptake in the right breast tail pending a dedicated study.
  meaning: >-
    The bone metastases express somatostatin receptors, the target of
    radioligand therapy (PRRT). It supports on imaging the tumor's
    neuroendocrine face and opens a route that breast-cancer protocols do not
    contemplate as standard.
  caveat: >-
    Limits: the PET dates from May 2026, before the liver lesions appeared, so
    their SSTR status is unknown. Bone uptake was heterogeneous, with lesions
    showing no gallium. The FDG-PET of 8 September 2026 describes liver and
    bone progression, with new lesions.
  quote: >-
    Study showing multiple blastic bone metastases with somatostatin receptor
    overexpression. Focal uptake in the right breast tail to be evaluated in a
    dedicated study.
boneBiopsy:
  title: Bone biopsy (right iliac crest)
  date: 1st attempt 2026-04-30 (no tumor) · 2nd attempt 2026-07-08 (tumor) · reports 2026-07-17 and 2026-08-19
  site: Right iliac crest
  result: >-
    The first attempt (April 2026) yielded no tumor: only “mineralized bone
    trabeculae and skeletal muscle fibers”. The second one (July 2026) did yield
    viable tumour tissue, and it is the first molecular characterisation
    done on tissue rather than ctDNA. Pathology concludes bone metastasis of the
    breast neuroendocrine tumour, with positive synaptophysin and Ki67 around
    15%. The pathologist states two explicit caveats: the sample contains little
    tumour tissue, and grading of neuroendocrine tumours is not established on
    small biopsies —with this morphology and that Ki67 a moderately
    differentiated tumour is assumed—. Hormone
    receptors and HER2 were not assessed on this sample: the most recent HER2
    IHC 0 comes from the liver biopsy (report of 21-09-2026). The tissue molecular profile
    (FoundationOne CDx, July 2026) shows 11q13 amplification
    (CCND1, FGF3, FGF4, FGF19; ≈37 copies) and 8p11 amplification (FGFR1,
    NSD3, ZNF703; ≈33 copies); TMB 4 Muts/Mb (low), MS-Stable, HRDsig negative
    and no active mutational signatures; no reportable alteration in ESR1,
    RB1, TP53, PIK3CA, PTEN, AKT1, BRCA1/2 or ERBB2. What is absent matters as
    much as what is present: the RB1 variants and the ESR1 D538G mutation were
    detected in ctDNA (April 2026) and are not confirmed in this bone — it may
    be heterogeneity between lesions or subclonal populations in blood; ctDNA
    has not been repeated on this same lesion.
