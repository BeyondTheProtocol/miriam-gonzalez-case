imaging:
  title: Gallium-68 DOTATOC PET-CT
  date: May 26, 2026
  summary: >-
    Multiple blastic bone metastases with somatostatin receptor overexpression
    (subtype 2, SSTR2). Focal uptake in the right breast tail pending a dedicated study.
  meaning: >-
    The tumor expresses somatostatin receptors — the target of radioligand
    therapy (PRRT). It confirms on imaging
    both tumor drivers (luminal FGFR1/CCND1 + neuroendocrine RB1 + SSTR) and
    opens a route that breast-cancer protocols do not contemplate as standard.
  quote: >-
    Study showing multiple blastic bone metastases with somatostatin receptor
    overexpression. Focal uptake in the right breast tail to be evaluated in a
    dedicated study.
boneBiopsy:
  title: Bone biopsy (right iliac lesion)
  date: Received 2026-04-30 · report 2026-05-08
  site: Right iliac lesion
  result: >-
    No tumor present — “mineralized bone trabeculae and skeletal muscle
    fibers, no neoplasm observed”. Molecular information is obtained from
    plasma ctDNA instead.
