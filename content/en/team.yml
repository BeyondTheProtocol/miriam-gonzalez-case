    icon: ph:user-circle-fill
    color: gold
  - role: "Genomics & molecular profiling"
    name: Paola
    photo: /img/team/paola.webp
    description: "Bioengineer. She helps interpret the molecular data and guide the next steps in the plan."
    icon: ph:pulse-fill
    color: gold
  - role: "Research & clinical trials"
    name: Alejandro
    photo: /img/team/alejandro.webp
    description: "A researcher with a doctorate. He works with the team and advises on clinical trials to help steer the case's options."
    icon: ph:clipboard-text-fill
    color: gold
  - role: "Breast cancer advisory"
    name: Víctor
    photo: /img/team/victor.webp
    description: "He brings his clinical experience to help guide the case's decisions."
    icon: ph:stethoscope-fill
    color: ocean
  - role: "Neuroendocrine advisory"
    name: David
    photo: /img/team/david.webp
    description: "He brings his clinical experience to help guide the case's decisions."
    icon: ph:stethoscope-fill
    color: ocean
  - role: "Cancer research"
    name: Paloma
    photo: /img/team/paloma.webp
    description: "Researcher at the Dana-Farber Cancer Institute (Harvard). She studies neuroendocrine differentiation."
    icon: ph:flask-fill
    color: gold
  - role: "AI & outreach"
    name: Javi
    photo: /img/team/javi.webp
    description: "Using AI, he generates the reports that underpin the treatment proposal, and helps spread the word."
    icon: ph:megaphone-fill
    color: ocean
  - role: "Artificial intelligence"
    name: Alby
    photo: /img/team/alby.webp
    description: "He adapts AI tools to Miriam's case to organize information and ease the manual work."
    icon: ph:robot-fill
    color: ocean
  - role: "Digital tools & product"
    name: Dani
    photo: /img/team/dani.webp
    description: "He builds and maintains the digital tools the team uses."
    icon: ph:device-mobile-fill
    color: ink
  - role: "Web & communication"
    name: Ceci
    photo: /img/team/ceci.webp
    description: "She builds and maintains helpmiriam.com, and makes sure every piece of information is clear at first read."
    icon: ph:code-fill
    color: ocean
  - role: "Community coordination"
    name: Afor
    photo: /img/team/afor.webp
    description: "She connects and organizes the community members who collaborate on helpmiriam's projects."
    icon: ph:users-three-fill
    color: ink
  - role: "Narrative & copy"
    name: Alba
    photo: /img/team/alba.webp
    description: "She gives a human touch to everything that's published. She looks after the story, the tone and the words of the project."
    icon: ph:pen-nib-fill
    color: gold
medicalNetwork:
  - role: "Vall d'Hebron · VHIO (Barcelona)"
    description: "Takes the case to its multidisciplinary tumor board and opens a direct path to advanced-therapy trials relevant to this profile."
    icon: ph:atom-fill
    color: ocean
  - role: "Molecular oncology · Zürich (Switzerland)"
    description: "An internationally recognized molecular oncology team. Helps with the biopsy and the molecular analysis, and with the integrated treatment strategy for this breast profile with neuroendocrine differentiation."
    icon: ph:stethoscope-fill
    color: gold
  - role: "Precision oncology (USA)"
    description: "One of the 25 most influential voices in precision medicine worldwide, with hundreds of publications and several FDA-approved drugs. She has taken an interest in Miriam's case to discuss it within international networks."
    icon: ph:stethoscope-fill
    color: gold
  - role: "Dana-Farber · Harvard (USA)"
    description: "A link to the Dana-Farber Cancer Institute, Harvard-affiliated, through the team's researcher who studies neuroendocrine differentiation there."
    icon: ph:graduation-cap-fill
    color: gold
integrativeSupport:
  - role: "Metabolic oncology (Spain)"
    description: "A specialist in the metabolic approach to cancer. Designs Miriam's supplementation and metabolic support protocol."
    icon: ph:flask-fill
    color: ocean
  - role: "Training & exercise oncology (Spain)"
    description: "Designs Miriam's training to keep her at {ecog}."
    icon: ph:barbell-fill
    color: ink
  - role: "Oncology nutritionist"
    description: "Specialized in nutrition for cancer patients. Manages Miriam's nutritional follow-up throughout the treatment."
    icon: ph:plant-fill
    color: gold
  - role: "Oncology psychology"
    description: "A psychologist specialized in emotional support for people with cancer."
    icon: ph:heart-fill
    color: gold
  - role: "Psychology & giftedness"
    description: "A psychologist specialized in giftedness. Supports Miriam, integrating the cognitive dimension with the oncology process."
    icon: ph:brain-fill
    color: ocean
  - role: "Physiotherapy & acupuncture (TCM)"
    description: "A physiotherapist trained in traditional Chinese medicine. Complements Miriam's exercise and mobility program."
    icon: ph:hand-palm-fill
    color: ink
