coreTeam:
  - role: "Engineer & founder"
    name: Miriam González
    photo: /img/team/miriam.webp
    featured: true
    description: "Software engineer and communicator. She researches her own case and coordinates the initiative."
    icon: ph:user-circle-fill
    color: gold
  - role: "Research & trials"
    name: Alejandro
    photo: /img/team/alejandro.webp
    description: "Research doctorate. He advises on clinical trials and on translating findings into an N-of-1 approach."
    icon: ph:clipboard-text-fill
    color: gold
  - role: "Technical advisory · breast"
    name: Víctor
    photo: /img/team/victor.webp
    description: "Technical profile. Years of self-directed study in breast oncology; brings judgment and context to the case."
    icon: ph:books-fill
    color: ocean
  - role: "Epigenomics · Dana-Farber"
    name: Paloma
    photo: /img/team/paloma.webp
    description: "PhD. Associate Scientific Director at Dana-Farber (Harvard). She researches neuroendocrine differentiation in the tumor, alongside epigenetics and biomarkers."
    icon: ph:flask-fill
    color: gold
medicalNetwork:
  - role: "Vall d'Hebron · VHIO (Barcelona)"
    description: "Takes the case to its multidisciplinary tumor board and opens a direct path to advanced-therapy trials relevant to this profile."
    icon: ph:atom-fill
    color: ocean
  - role: "Molecular oncology · Zürich (Switzerland)"
    description: "An internationally recognized molecular oncology team. Helps with the biopsy and molecular analysis, and with integrated treatment strategy for this breast profile with neuroendocrine differentiation."
    icon: ph:stethoscope-fill
    color: gold
  - role: "Precision oncology (USA)"
    description: "One of the 25 most influential voices in precision medicine worldwide, with hundreds of publications and several FDA-approved drugs. She has taken an interest in Miriam's case to discuss it within international networks."
    icon: ph:stethoscope-fill
    color: gold
  - role: "Dana-Farber · Harvard (USA)"
    description: "Direct link to Dana-Farber (Harvard) through Paloma Cejas, PhD, Associate Scientific Director at the institute."
    icon: ph:graduation-cap-fill
    color: gold
integrativeSupport:
  - role: "Metabolic oncology (Spain)"
    description: "A specialist in the metabolic approach to cancer. Designs Miriam's supplementation and metabolic support protocol."
    icon: ph:flask-fill
    color: ocean
  - role: "Training & exercise oncology (Spain)"
    description: "Designs Miriam's training to keep her at {ecog}."
    icon: ph:barbell-fill
    color: ink
  - role: "Oncology nutritionist"
    description: "Specialized in nutrition for cancer patients. Manages Miriam's nutritional follow-up throughout treatment."
    icon: ph:plant-fill
    color: gold
  - role: "Oncology psychology"
    description: "A psychologist specialized in emotional support for people with cancer."
    icon: ph:heart-fill
    color: gold
  - role: "Psychology & giftedness"
    description: "A psychologist specialized in giftedness. Supports Miriam, integrating the cognitive dimension with the oncology process."
    icon: ph:brain-fill
    color: ocean
  - role: "Physiotherapy & acupuncture (TCM)"
    description: "A physiotherapist trained in traditional Chinese medicine. Complements Miriam's exercise and mobility program."
    icon: ph:hand-palm-fill
    color: ink