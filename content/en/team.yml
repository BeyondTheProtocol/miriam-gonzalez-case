coreTeam:
  - role: "Patient & founder"
    name: Miriam González
    photo: /img/team/miriam.webp
    featured: true
    description: "Software engineer and technology communicator. She actively researches her case and coordinates the entire initiative."
    icon: ph:user-circle-fill
    color: gold
  - role: "Precision oncology & molecular profiling"
    name: Paola
    photo: /img/team/paola.webp
    description: "A scientist with a background in bioengineering. She's the one who best understands the molecular and DNA side of the case, and advises on it."
    icon: ph:pulse-fill
    color: gold
  - role: "Research & clinical trials"
    name: Alejandro
    photo: /img/team/alejandro.webp
    description: "He holds a doctorate. He researches alongside the team and advises on clinical trials, helping steer the case's options."
    icon: ph:clipboard-text-fill
    color: gold
  - role: "Breast cancer advisory"
    name: Víctor
    photo: /img/team/victor.webp
    description: "Specialized in breast cancer. Together with David, he covers the clinical advisory side of the case, each from their own specialty."
    icon: ph:stethoscope-fill
    color: ocean
  - role: "Neuroendocrine tumor advisory"
    name: David
    description: "Specialized in neuroendocrine tumors. Together with Víctor, he covers the clinical advisory side of the case, each from their own specialty."
    icon: ph:stethoscope-fill
    color: ocean
  - role: "Cancer research"
    name: Paloma
    description: "Researcher at the Dana-Farber Cancer Institute, a Harvard-affiliated center, where she studies neuroendocrine differentiation."
    icon: ph:flask-fill
    color: gold
  - role: "AI & outreach"
    name: Javi
    description: "With artificial intelligence he produces the reports that inform the treatment proposal, and collaborates on outreach."
    icon: ph:megaphone-fill
    color: ocean
  - role: "Artificial intelligence"
    name: Alby
    photo: /img/team/alby.webp
    description: "He leads the project's artificial intelligence. He adapts tools to the specifics of the case to organize information and reduce manual work."
    icon: ph:robot-fill
    color: ocean
  - role: "Digital tools & product"
    name: Dani
    description: "He builds the project's digital tools — among them, the app that gathers and organizes the case's medical history so it's always at hand."
    icon: ph:device-mobile-fill
    color: ink
  - role: "Web & communication"
    name: Ceci
    photo: /img/team/ceci.webp
    description: "In charge of the website. She builds and maintains helpmiriam.com, and makes sure every piece of information is clear at first read."
    icon: ph:code-fill
    color: ocean
  - role: "Community coordination"
    name: Afor
    description: "She coordinates the community members who collaborate on helpmiriam's projects."
    icon: ph:users-three-fill
    color: ink
  - role: "Narrative & copy"
    name: Alba
    photo: /img/team/alba.webp
    description: "She gives a human touch to everything that's published. She looks after the story, the tone and the words of the project."
    icon: ph:pen-nib-fill
    color: gold
medicalNetwork:
  - role: "Treating oncologist (Spain)"
    description: "The oncologist who has followed the case since diagnosis. Open to new approaches and up to date with the latest advances in precision oncology."
    icon: ph:stethoscope-fill
    color: ink
  - role: "Radiation oncology · Vall d'Hebron (VHIO, Barcelona)"
    description: "Brings the case to the Vall d'Hebron (VHIO) multidisciplinary tumor board and opens a direct line to advanced-therapy trials relevant to this profile."
    icon: ph:atom-fill
    color: ocean
  - role: "Molecular oncology (Europe)"
    description: "An internationally recognized molecular oncology specialist. Supports the molecular analysis strategy, coordinates with reference labs and validates the case's clinical approach."
    icon: ph:stethoscope-fill
    color: gold
  - role: "Precision oncology (USA)"
    description: "Recognized worldwide as one of the 25 most influential voices in precision medicine. Associate director of clinical research in precision oncology, with more than 950 scientific publications and behind the FDA approval of 8 drugs. Interested in Miriam's case to discuss it within international precision-oncology networks."
    icon: ph:stethoscope-fill
    color: gold
  - role: "Dana-Farber · Harvard (USA)"
    description: "A link to the Dana-Farber Cancer Institute, a Harvard-affiliated center, through the team's researcher who studies neuroendocrine differentiation there."
    icon: ph:graduation-cap-fill
    color: gold
integrativeSupport:
  - role: "Metabolic oncology (Spain)"
    description: "A specialist in the metabolic approach to cancer. Designs Miriam's supplementation and metabolic support protocol."
    icon: ph:flask-fill
    color: ocean
  - role: "PhD in Sports Science & exercise oncology (Spain)"
    description: "Lead researcher at the OncSport — Never Surrender Foundation. Designs and oversees Miriam's individualized training, adapted to her bone metastasis, to keep her at ECOG 0 (full functional capacity)."
    icon: ph:barbell-fill
    color: ink
  - role: "Oncology nutritionist"
    description: "Specialized in nutrition for cancer patients. Manages Miriam's nutritional follow-up throughout the treatment."
    icon: ph:plant-fill
    color: gold
  - role: "Oncology psychology (AECC association)"
    description: "A psychologist specialized in emotional support for people with cancer. Collaborates through the AECC association."
    icon: ph:heart-fill
    color: gold
  - role: "Psychology & giftedness"
    description: "A psychologist specialized in giftedness. Supports Miriam, integrating the cognitive dimension with the oncology process."
    icon: ph:brain-fill
    color: ocean
  - role: "Physiotherapy & acupuncture (TCM)"
    description: "A physiotherapist trained in traditional Chinese medicine. Complements Miriam's exercise and mobility program."
    icon: ph:hand-palm-fill
    color: ink
