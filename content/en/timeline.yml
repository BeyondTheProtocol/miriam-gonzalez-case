entries:
  - date: '2021'
    tag: Background
    title: A first warning that went unanswered
    description: >
      Miriam goes to the emergency room due to bleeding in the breast. An ultrasound is
      performed. The result is normal. And that's where it ends.
    highlight: false

  - date: 'Oct 31, 2023'
    tag: Symptoms
    title: Back pain begins
    description: >
      Miriam begins to notice persistent lower back pain. Weeks of physiotherapy and
      consultations with no clear answer. Until she requests an MRI herself.
    highlight: false

  - date: 'Jan 11, 2024'
    tag: Diagnosis
    title: The result arrives by email
    description: >
      The MRI report arrives by email on a Thursday morning. The conclusion: "probable
      vertebral metastases." No doctor present. No context. Just a screen. That same day,
      Miriam is admitted to the emergency room. The following Tuesday she receives the full
      diagnosis: stage IV breast cancer with neuroendocrine differentiation, multiple bone
      metastases, and spinal cord compression at L3. She is 33 years old. That same Tuesday,
      radiotherapy begins on the affected vertebrae.
    highlight: true

  - date: 'Jan–Feb 2024'
    tag: First line
    title: The first treatment begins
    description: >
      First-line treatment begins with letrozole, ribociclib, Zoladex (goserelin), and
      zoledronic acid. After the first cycle, Miriam is urgently admitted with acute
      respiratory failure. Ribociclib is permanently discontinued.
    highlight: false

  - date: 'Feb–Apr 2024'
    tag: Urgent admission
    title: '50 days hospitalized, 10 in ICU'
    description: >
      The severe neutropenia caused by ribociclib led to bilateral necrotizing pneumonia
      with areas of pulmonary necrosis. Miriam is admitted to the ICU with severe respiratory
      failure, critically low platelet counts, and the need for high-flow respiratory support.
      Bronchoscopy, transfusions, and intensive antibiotic therapy are required. Total hospital
      stay exceeds 50 days. This was the most critical moment since diagnosis.
    highlight: true
    image: /img/hospital.webp
    imageAlt: "Miriam in the ICU during her hospital stay. Intubated but looking divine, doing her skincare routine."

  - date: 'Jul 2024'
    tag: Molecular
    title: The tumor reveals its molecular identity
    description: >
      Miriam participates in the DIPCAN study, enabling a complete genomic analysis of the
      tumor (TSO500). The results reveal the key markers: FGFR1 amplified ×13, CCND1 ×20,
      FGF3/4/19 ×18 (11q13 cluster). The analysis also detects a striking discrepancy in the
      progesterone receptor (PR): the same tumor sample returns 5% at the local laboratory
      but 100% at the external reference laboratory — a difference with direct implications
      for hormonal treatment decisions.
    highlight: true

  - date: 'Jan 2025'
    tag: Second line
    title: A change of plan after progression
    description: >
      Following confirmed progression on PET-CT, second-line treatment begins: letrozole
      is switched to fulvestrant and ribociclib to abemaciclib. Zoladex continued.
    highlight: false

  - date: 'Mar 2026'
    tag: Progression
    title: Bone progression
    description: >
      The PET-CT of 24 Mar 2026 confirms bone progression (more uptake in pelvis and right
      femur; new foci in D1 and left iliac). On 30 Mar abemaciclib —always at 100 mg— is
      stopped due to the progression and mild hepatotoxicity that normalized once withdrawn.
      Zoladex and zoledronic acid continue; the search for the next strategy begins.
    highlight: true

  - date: 'Apr 2026'
    tag: Team
    title: The team forms and the search begins
    description: >
      Miriam begins researching her own case with artificial intelligence. A thread on Twitter.
      A few professionals who see it and say: I can help. Within days, a spontaneous
      multidisciplinary team forms with specialists from three countries.
    highlight: true
    link: https://x.com/miriamgonp/status/2041824144484917749
    linkLabel: 'See the original thread on Twitter →'

  - date: 'Apr 7, 2026'
    tag: Molecular
    title: Reading the tumor without touching it
    description: >
      First plasma ctDNA, within a liquid biopsy trial. Baseline profile of the tumor
      without needing tissue. Results: ESR1 D538G detected and low MSI status.
    highlight: false

  - date: 'Apr 8–9, 2026'
    tag: AI
    title: Putting the whole case in writing
    description: >
      A complete clinical summary of the case is generated using advanced language models.
      The document is designed for international second opinions and to communicate the case
      to high-level specialists.
    highlight: true
    link: https://x.com/javilop/status/2041905341059973294
    linkLabel: 'See documentation thread →'

  - date: 'Apr 13, 2026'
    tag: Molecular
    title: A second reading confirms the profile
    description: >
      First blood ctDNA on the Guardant360 panel. Results: ESR1 D538G, 3 distinct RB1
      mutations, FGFR1 amplified and CCND1 amplified.
    highlight: false

  - date: 'Apr 20, 2026'
    tag: Outreach
    title: Talk at Codemotion Madrid
    description: >
      Miriam takes the stage at Codemotion Madrid to talk about how AI is helping advance
      her case. First public outreach event of the project and her return to the tech
      ecosystem after two years.
    highlight: true
    link: https://x.com/miriamgonp/status/2046266823209890162
    linkLabel: 'See the thread on Twitter →'

  - date: 'Apr 30, 2026'
    tag: Molecular
    title: The needle finds no tumor
    description: >
      The needle reaches the lesion, but the sample collected is bone tissue, not active
      tumor. Results: mineralized bone trabeculae and skeletal muscle fibers, with no
      neoplastic cells. This does not rule out disease — it only confirms that tissue
      profiling can't be done through this route. The molecular picture keeps coming from
      ctDNA in blood.
    highlight: false

  - date: 'May 13, 2026'
    tag: Molecular
    title: The tumor keeps changing
    description: >
      Second blood ctDNA on the Guardant360 CDx panel. Results: ESR1 D538G (0.84%), CCND1
      amplified (6.83), FGFR1 amplified (5.86), RB1 V622Yfs*33 (0.19%) and the new SMO V319D
      (0.26%) — clinical significance uncertain, under watch.
    highlight: false

  - date: 'May 2026'
    tag: Third line
    title: The third line is offered
    description: >
      With the ESR1 resistance mutation (D538G) confirmed in blood, elacestrant is offered
      as a standard 3rd line (public funding approved), pending start. In parallel, clinical
      trials and the radioligand route (PRRT) are evaluated.
    highlight: false
  - date: 'May 17, 2026'
    tag: Outreach
    title: The problem with the Spanish protocols
    description: >
      Video explaining why Spanish protocols fall short for this profile and a call to
      spread the case.
    highlight: false
    link: https://x.com/miriamgonp/status/2055872406858682514
    linkLabel: 'Watch the video →'

  - date: 'May 21, 2026'
    tag: Molecular
    title: Experts from several countries review the case
    description: >
      The WIN Consortium international molecular tumor board meets to review Miriam's case.
    highlight: true

  - date: 'May 30, 2026'
    tag: Molecular
    title: A new scan opens another door
    description: >
      Ga-68 DOTATOC PET-CT. Multiple blastic bone
      metastases with somatostatin receptor overexpression and focal uptake in the right
      breast tail. Confirms the tumor's "two sides" (luminal FGFR1/CCND1 + neuroendocrine
      RB1 + SSTR behavior) and opens the radioligand therapy path (PRRT).
    highlight: true
    link: https://x.com/miriamgonp/status/2060649242037723567
    linkLabel: 'See the Ga-68 PET thread →'

  - date: 'Jun 5, 2026'
    tag: Molecular
    title: The breast biopsy doesn't yield enough tumor
    description: >
      A breast biopsy is done to try to qualify for a trial that requires tumor tissue. The
      analyzable sample is tiny (0.3 mm), not enough to meet the criteria, so this route
      doesn't allow entry.
    highlight: false

  - date: 'Jun 9, 2026'
    tag: Outreach
    title: helpmiriam.com at the M. Chiara Giorgetti Award, in Barcelona
    description: >
      Miriam presents the project at the M. Chiara Giorgetti Award ceremony —given by the Spanish
      Metastatic Breast Cancer Association for research into this cancer— held in Barcelona. Very
      well received.
    highlight: true
    link: https://www.cancermamametastasico.es/premio-chiara/
    linkLabel: 'About the M. Chiara Giorgetti Award →'

  - date: 'Jun 11, 2026'
    tag: Progression
    title: A lesion threatening the spinal cord, and urgent radiotherapy
    description: >
      A follow-up MRI, after 73 days without treatment, shows clear bone progression and, above
      all, a lesion in the T11 vertebra starting to threaten the spinal canal: the risk of cord
      compression is real. Urgent SBRT radiotherapy is scheduled to shrink the lesion and protect
      the spinal cord.
    highlight: true

  - date: 'Jun 19, 2026'
    tag: Outreach
    title: The metastasis map goes public
    description: >
      Miriam openly publishes the interactive map of her metastases: the tool that helps her team
      understand the case and decide, for example, where to biopsy. That same day, El Español tells
      her story. She shares it on X with great excitement.
    highlight: true
    link: https://x.com/miriamgonp/status/2068004136621109648
    linkLabel: 'See the announcement on X →'

  - date: 'Jun 26–30, 2026'
    tag: Clinical trials
    title: The vaccine route closes
    description: >
      Both personalized vaccines under exploration fall through in the same week. One, because it
      requires measurable disease and Miriam's metastases are bone-only: an entry criterion that
      leaves out many patients like her. The other, because its last slot had just been filled.
      One of the two stays open should the situation change.
    highlight: true

  - date: 'Jul 13, 2026'
    tag: Progression
    title: 'The cancer leaves the bone: liver lesions appear'
    description: >
      The trial screening imaging shows lesions in the liver. Until now the disease had been
      bone-only. Liver function remains within normal range, but the tumour is no longer
      confined to bone: it is spreading, and every month that passes narrows the window to
      find something that works.
    highlight: true

  - date: 'Jul 15, 2026'
    tag: Outreach
    title: The case reaches episode 100 of Roca Project
    description: >
      Miriam's interview on Roca Project, Carlos Roca's podcast, is released as its special
      100th episode, with her among the guests most voted for by the community. An hour and a
      half on the road to diagnosis, what metastatic breast cancer with neuroendocrine
      differentiation means, and why protocols don't cover all the genetics. Over the following
      days the website's contact form fills up: engineers, researchers, patients, and people who
      simply want to help.
    highlight: true
    link: https://www.youtube.com/watch?v=zVUECrux6zA
    linkLabel: 'Watch the full interview →'

  - date: 'Jul 15, 2026'
    tag: Clinical trials
    title: First treatment day on a phase 1 trial
    description: >
      Miriam starts a phase 1 trial with BG-75202 combined with fulvestrant, at Vall d'Hebron's
      Early Drug Development Unit in Barcelona. It comes after months of closed doors and a long
      screening, with trips to Barcelona every few days.
    highlight: true
    link: https://clinicaltrials.gov/study/NCT07222267
    linkLabel: 'See the BG-75202 trial →'
