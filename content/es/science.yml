imaging:
  title: PET-CT con Galio-68 DOTATOC
  date: 26 de mayo de 2026
  summary: >-
    Múltiples metástasis óseas blásticas con sobreexpresión de receptores de
    somatostatina (subtipo 2, SSTR2). Captación focal en cola de mama derecha pendiente
    de estudio dirigido.
  meaning: >-
    El tumor expresa receptores de somatostatina — diana de la terapia con
    radioligandos (PRRT). Confirma sobre imagen
    los dos motores del tumor (luminal FGFR1/CCND1 + neuroendocrino
    RB1 + SSTR) y abre una vía que los protocolos de mama no contemplan de forma
    estándar.
  quote: >-
    Estudio con múltiples metástasis óseas blásticas con sobreexpresión de
    receptores de somatostatina. Captación focal en cola de mama derecha a
    valorar en estudio dirigido.
boneBiopsy:
  title: Biopsia ósea (lesión ilíaca derecha)
  date: Recibida 30/04/2026 · informe 08/05/2026
  site: Lesión ilíaca derecha
  result: >-
    No contenía tumor — «trabéculas óseas mineralizadas y fibras músculo
