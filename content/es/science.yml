imaging:
  title: PET-CT con Galio-68 DOTATOC
  date: 26 de mayo de 2026
  summary: >-
    Múltiples metástasis óseas blásticas con sobreexpresión de receptores de
    somatostatina (SSTR). Captación focal en cola de mama derecha pendiente
    de estudio dirigido.
  meaning: >-
    Las metástasis óseas expresan receptores de somatostatina, diana de la
    terapia con radioligandos (PRRT). Refuerza por imagen la cara
    neuroendocrina del tumor y abre una vía que los protocolos de mama no
    contemplan de forma estándar.
  caveat: >-
    Límites: el PET es de mayo de 2026, antes de que aparecieran las lesiones
    del hígado, así que su estado SSTR no se conoce. La captación en hueso fue
    heterogénea, con lesiones sin galio. El PET-FDG del 8 de septiembre de
    2026 describe progresión hepática y ósea, con lesiones nuevas.
  quote: >-
    Estudio con múltiples metástasis óseas blásticas con sobreexpresión de
    receptores de somatostatina. Captación focal en cola de mama derecha a
    valorar en estudio dirigido.
boneBiopsy:
  title: Biopsia ósea (cresta ilíaca derecha)
  date: 1er intento 30/04/2026 (sin tumor) · 2º intento 08/07/2026 (con tumor) · informes 17/07 y 19/08/2026
  site: Cresta ilíaca derecha
  result: >-
    El primer intento (abril 2026) no obtuvo tumor: solo «trabéculas óseas
    mineralizadas y fibras músculo esqueléticas». El segundo (julio 2026) sí
    obtuvo tejido tumoral viable, y es la primera caracterización molecular
    hecha sobre tejido y no sobre ctDNA. La anatomía patológica concluye metástasis
    ósea del tumor neuroendocrino de mama, con sinaptofisina positiva y Ki67 de
    alrededor del 15%. El patólogo deja dos reservas explícitas: la muestra
    contiene poco tejido tumoral, y la gradación de los tumores neuroendocrinos
    no está establecida en biopsias pequeñas —con esta morfología y ese Ki67
    asume un tumor moderadamente diferenciado—. Receptores
    hormonales y HER2 no se determinaron en esta muestra: el HER2 IHQ 0 más
    reciente es el de la biopsia hepática (informe del 21-09-2026). El perfil molecular del tejido
    (FoundationOne CDx, julio 2026) muestra amplificación de 11q13
    (CCND1, FGF3, FGF4, FGF19; ≈37 copias) y amplificación 8p11 (FGFR1, NSD3,
    ZNF703; ≈33 copias); TMB 4 Muts/Mb (baja), MS-Stable, HRDsig negativo y sin
    firmas mutacionales activas; sin alteración reportable en ESR1, RB1, TP53,
    PIK3CA, PTEN, AKT1, BRCA1/2 ni ERBB2. Lo que no aparece importa tanto como
    lo que aparece: las variantes de RB1 y la ESR1 D538G se detectaron en ctDNA
    (abril 2026) y no se confirman en este hueso — puede ser heterogeneidad
    entre lesiones o clones subclonales en sangre; no se ha repetido el ctDNA
    sobre esta misma lesión.
