entries:
  - date: '2021'
    tag: Antecedentes
    title: Un primer aviso que quedó sin respuesta
    description: >
      Miriam acude a urgencias por un sangrado en la mama. Le realizan una ecografía.
      El resultado es normal. Y ahí se queda la cosa.
    highlight: false

  - date: '31 oct 2023'
    tag: Síntomas
    title: Empieza el dolor de espalda
    description: >
      Miriam empieza a notar un dolor lumbar persistente. Semanas de fisioterapia y
      consultas sin una respuesta clara. Hasta que ella misma solicita una resonancia magnética.
    highlight: false

  - date: '11 ene 2024'
    tag: Diagnóstico
    title: El resultado llega por email
    description: >
      El informe de la resonancia llega por email, un jueves por la mañana. La conclusión:
      "probable metástasis vertebrales". Sin médico al lado. Sin contexto. Solo una pantalla.
      Ese mismo día, Miriam ingresa por urgencias. El martes siguiente tiene el diagnóstico
      completo: carcinoma de mama con diferenciación neuroendocrina estadio IV, con metástasis
      óseas múltiples y compresión medular en L3. Tiene 33 años. Ese mismo martes inicia
      radioterapia sobre las vértebras afectadas.
    highlight: true

  - date: 'ene–feb 2024'
    tag: Primera línea
    title: Empieza el primer tratamiento
    description: >
      Se inicia primera línea de tratamiento con letrozol, ribociclib, Zoladex (goserelina) y
      ácido zoledrónico. Tras el primer ciclo, Miriam ingresa de urgencias con dificultad
      respiratoria aguda. El ribociclib se suspende definitivamente.
    highlight: false

  - date: 'feb–abr 2024'
    tag: Ingreso urgente
    title: '50 días hospitalizada, 10 en UCI'
    description: >
      La neutropenia severa causada por el ribociclib derivó en una neumonía necrotizante
      bilateral con áreas de necrosis pulmonar. Miriam ingresa en UCI con insuficiencia
      respiratoria grave, plaquetas en niveles críticos y necesidad de soporte respiratorio
      de alto flujo. Se realizan fibrobroncoscopia, transfusiones y antibioterapia intensiva.
      La estancia total supera los 50 días. Fue el momento más grave desde el diagnóstico.
    highlight: true
    image: /img/hospital.jpg
    imageAlt: "Miriam en la UCI durante su ingreso hospitalario. Entubada pero divina, haciendose el skincare"

  - date: 'jul 2024'
    tag: DIPCAN
    title: El tumor revela su identidad molecular
    description: >
      Miriam participa en el estudio DIPCAN, que permite realizar un análisis genómico completo
      del tumor (TSO500). Los resultados revelan los marcadores clave: FGFR1 amplificado ×13,
      CCND1 ×20, FGF3/4/19 ×18 (cluster 11q13). Además, el análisis detecta una discrepancia
      llamativa en el receptor de progesterona (PR): la misma muestra tumoral da un resultado
      de 5% en el laboratorio local pero 100% en el laboratorio de referencia externo — una
      diferencia con implicaciones directas en la elección del tratamiento hormonal.
    highlight: true

  - date: 'ene 2025'
    tag: Segunda línea
    title: Un cambio de plan tras la progresión
    description: >
      Tras confirmar progresión en PET-CT, se pasa a segunda línea: se sustituye letrozol
      por fulvestrant y ribociclib por abemaciclib. Zoladex se mantiene.
    highlight: false

  - date: 'mar 2026'
    tag: Progresión
    title: Progresión ósea — se suspende el abemaciclib
    description: >
      PET-CT confirma nuevos focos óseos. La progresión es la razón principal del cambio
      de estrategia. El abemaciclib se suspende también por toxicidad hepática (DILI G2-3),
      sin llegar a ser grave. El resto del tratamiento — Zoladex y ácido zoledrónico —
      continúa. Se inicia búsqueda activa de tercera línea.
    highlight: false

  - date: 'abr 2026'
    tag: Equipo
    title: Se forma el equipo y empieza la búsqueda
    description: >
      Miriam empieza a investigar su caso con inteligencia artificial. Un hilo en Twitter.
      Unos profesionales que lo ven y dicen: yo puedo ayudar. En días, se forma un equipo
      multidisciplinar espontáneo con especialistas de cuatro países.
    highlight: true
    link: https://x.com/miriamgonp/status/2041824144484917749
    linkLabel: 'Ver el hilo original en Twitter →'

  - date: '7 abr 2026'
    tag: Molecular
    title: Leer el tumor sin tocarlo
    description: >
      Primer ctDNA en plasma dentro del ensayo HOPE-FOCUS SOLTI-2401. Perfil basal del tumor
      sin necesidad de tejido. Resultados: ESR1 D538G detectada y estado MSI bajo.
    highlight: false
    link: https://clinicaltrials.gov/study/NCT06991946
    linkLabel: 'Ver cómo funciona el ensayo HOPE-Focus →'

  - date: '8–9 abr 2026'
    tag: IA
    title: Poner todo el caso por escrito
    description: >
      Se genera el resumen clínico completo del caso usando modelos de lenguaje avanzados.
      El documento está diseñado para segundas opiniones internacionales y para comunicar
      el caso a especialistas de alto nivel.
    highlight: true
    link: https://x.com/javilop/status/2041905341059973294
    linkLabel: 'Ver hilo de documentación →'

  - date: '13 abr 2026'
    tag: Molecular
    title: Una segunda lectura confirma el perfil
    description: >
      Primer ctDNA en sangre con el panel Guardant360. Resultados: ESR1 D538G, 3 mutaciones
      distintas en RB1, FGFR1 amplificado y CCND1 amplificado.
    highlight: false

  - date: '20 abr 2026'
    tag: Divulgación
    title: Ponencia en Codemotion Madrid
    description: >
      Miriam sube al escenario de Codemotion Madrid para hablar de cómo la IA está ayudando
      a avanzar su caso. Primer acto público de divulgación del proyecto y regreso al
      ecosistema tech tras dos años.
    highlight: true
    link: https://x.com/miriamgonp/status/2046266823209890162
    linkLabel: 'Ver el hilo en Twitter →'

  - date: '30 abr 2026'
    tag: Molecular
    title: La aguja no encuentra tumor
    description: >
      La aguja accede a la lesión, pero la muestra obtenida es de hueso, no de tumor activo.
      Resultados: trabéculas óseas mineralizadas y fibras musculares, sin células neoplásicas.
      No descarta la enfermedad; solo confirma que por esta vía no se podrá hacer perfilado
      tisular. La información molecular se sigue obteniendo del ctDNA en sangre.
    highlight: false

  - date: '13 may 2026'
    tag: Molecular
    title: El tumor sigue cambiando
    description: >
      Segundo ctDNA en sangre con el panel Guardant360 CDx. Resultados: ESR1 D538G (0,84%),
      CCND1 amplificado (6,83), FGFR1 amplificado (5,86), RB1 V622Yfs*33 (0,19%) y la nueva
      SMO V319D (0,26%) — significado clínico incierto, en vigilancia.
    highlight: false

  - date: '17 may 2026'
    tag: Divulgación
    title: El problema de los protocolos españoles
    description: >
      Vídeo explicando por qué los protocolos españoles se quedan cortos para este perfil y
      llamamiento para difundir el caso.
    highlight: false
    link: https://x.com/miriamgonp/status/2055872406858682514
    linkLabel: 'Ver el vídeo →'

  - date: '21 may 2026'
    tag: Clínico
    title: Expertos de varios países revisan el caso
    description: >
      Se celebra el comité molecular internacional del WIN Consortium sobre el caso de
      Miriam.
    highlight: true

  - date: '30 may 2026'
    tag: Molecular
    title: Una nueva imagen abre otra puerta
    description: >
      PET-CT con Galio-68 DOTATOC. Múltiples metástasis
      óseas blásticas con sobreexpresión de receptores de somatostatina y captación focal
      en la cola de la mama derecha. Confirma las “dos caras” del tumor (FGFR1/CCND1
      luminal + comportamiento neuroendocrino RB1 + SSTR) y abre la vía de la terapia con
      radioligandos (PRRT).
    highlight: true
    link: https://x.com/miriamgonp/status/2060649242037723567
    linkLabel: 'Ver el hilo del PET Galio →'
