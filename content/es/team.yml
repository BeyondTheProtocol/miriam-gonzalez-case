coreTeam:
  - role: "Paciente y fundadora"
    name: Miriam González
    photo: /img/team/miriam.webp
    featured: true
    description: "Ingeniera de software y divulgadora. Investiga su propio caso y coordina la iniciativa."
    icon: ph:user-circle-fill
    color: gold
  - role: "Genómica y proteómica"
    name: Paola
    photo: /img/team/paola.webp
    description: "Bioingeniera. Interpreta el perfil molecular y la vía de proteómica funcional del tumor."
    icon: ph:pulse-fill
    color: gold
  - role: "Investigación y ensayos"
    name: Alejandro
    photo: /img/team/alejandro.webp
    description: "Doctor en investigación. Asesora en ensayos clínicos y en la traducción al abordaje N-of-1."
    icon: ph:clipboard-text-fill
    color: gold
  - role: "Asesoría técnica · mama"
    name: Víctor
    photo: /img/team/victor.webp
    description: "Perfil técnico. Años de estudio autodidacta en oncología de mama; aporta criterio y contexto al caso."
    icon: ph:books-fill
    color: ocean
  - role: "Imagen médica e IA"
    name: David
    photo: /img/team/david.webp
    description: "Formación en técnicas avanzadas de imagen. Analiza PET/DICOM con IA y señala focos para revisar con Medicina Nuclear."
    icon: ph:scan-fill
    color: ocean
  - role: "Epigenómica · Dana-Farber"
    name: Paloma
    photo: /img/team/paloma.webp
    description: "PhD. Directora científica asociada en Dana-Farber (Harvard). Epigenética, biomarcadores e heterogeneidad tumoral."
    icon: ph:flask-fill
    color: gold
  - role: "Inteligencia artificial y difusión"
    name: Javi
    photo: /img/team/javi.webp
    description: "Con IA, genera informes de síntesis para la propuesta terapéutica y apoya la difusión del caso."
    icon: ph:megaphone-fill
    color: ocean
  - role: "Ingeniería de IA"
    name: Alby
    photo: /img/team/alby.webp
    description: "Diseña agentes y pipelines de IA para el caso: ordenan la información y aligeran el trabajo manual."
    icon: ph:robot-fill
    color: ocean
  - role: "Desarrollo web · producto"
    name: Dani
    photo: /img/team/dani.webp
    description: "GDE en tecnologías web. Construye y mantiene las herramientas digitales del equipo."
    icon: ph:device-mobile-fill
    color: ink
  - role: "Web y accesibilidad"
    name: Ceci
    photo: /img/team/ceci.webp
    description: "Desarrolladora front-end. Construye helpmiriam.com con rigor de accesibilidad y claridad."
    icon: ph:code-fill
    color: ocean
  - role: "Coordinación de comunidad"
    name: Afor
    photo: /img/team/afor.webp
    description: "Conecta y organiza a las personas de la comunidad que colaboran en los proyectos de helpmiriam."
    icon: ph:users-three-fill
    color: ink
  - role: "Narrativa y textos"
    name: Alba
    photo: /img/team/alba.webp
    description: "Cuida la historia, el tono y las palabras del proyecto en todo lo que se publica."
    icon: ph:pen-nib-fill
    color: gold
medicalNetwork:
  - role: "Vall d'Hebron · VHIO (Barcelona)"
    description: "Lleva el caso a su comité tumoral multidisciplinar y abre una vía directa a ensayos de terapia avanzada relevantes para este perfil."
    icon: ph:atom-fill
    color: ocean
  - role: "Oncología molecular · Zúrich (Suiza)"
    description: "Equipo de oncología molecular de reconocimiento internacional. Ayuda con la biopsia y el análisis molecular, y con la estrategia de tratamiento integrada para este perfil de mama con diferenciación neuroendocrina."
    icon: ph:stethoscope-fill
    color: gold
  - role: "Oncología de precisión (EE.UU.)"
    description: "Una de las 25 voces más influyentes del mundo en medicina de precisión, con cientos de publicaciones y varios fármacos aprobados por la FDA. Se ha interesado por el caso de Miriam para discutirlo en redes internacionales."
    icon: ph:stethoscope-fill
    color: gold
  - role: "Dana-Farber · Harvard (EE.UU.)"
    description: "Enlace directo con Dana-Farber (Harvard) a través de Paloma Cejas, PhD, directora científica asociada del instituto."
    icon: ph:graduation-cap-fill
    color: gold
integrativeSupport:
  - role: "Oncología metabólica (España)"
    description: "Especialista en el abordaje metabólico del cáncer. Diseña el protocolo de suplementación y soporte metabólico de Miriam."
    icon: ph:flask-fill
    color: ocean
  - role: "Entrenamiento y oncología del ejercicio (España)"
    description: "Diseña el entrenamiento de Miriam para mantenerla en {ecog}."
    icon: ph:barbell-fill
    color: ink
  - role: "Nutricionista oncológica"
    description: "Especializada en nutrición para pacientes oncológicos. Lleva el seguimiento nutricional de Miriam a lo largo del tratamiento."
    icon: ph:plant-fill
    color: gold
  - role: "Psicología oncológica"
    description: "Psicóloga especializada en acompañamiento emocional a personas con cáncer."
    icon: ph:heart-fill
    color: gold
  - role: "Psicología y altas capacidades"
    description: "Psicóloga con especialización en altas capacidades. Acompaña a Miriam integrando la dimensión cognitiva con el proceso oncológico."
    icon: ph:brain-fill
    color: ocean
  - role: "Fisioterapia y acupuntura (medicina tradicional china)"
    description: "Fisioterapeuta con formación en medicina tradicional china. Complementa el programa de ejercicio y movilidad de Miriam."
    icon: ph:hand-palm-fill
    color: ink