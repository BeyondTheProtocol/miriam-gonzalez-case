[build]
  command = "npm_config_build_from_source=true pnpm rebuild better-sqlite3 && pnpm generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"

# ── Datos en vivo ────────────────────────────────────────────────────────────
# El total y la lista de donantes (estrellas + tabla) se sirven desde funciones
# que consultan GoFundMe al vuelo y se cachean en la CDN (no hace falta redeploy).
# La semilla generada en build (seed/*.json, FUERA de public/) se incluye en el
# bundle de las funciones como fallback por si GoFundMe no responde.
[functions]
  included_files = ["seed/fundraiser.json", "seed/donations.json"]

# OJO: el enrutado de /fundraiser.json y /donations.json a las funciones NO vive
# aquí. Igual que los enlaces cortos, un redirect en netlify.toml (aunque sea
# `force=true`) PIERDE contra el catch-all `/* /404.html 404` del `dist/_redirects`
# que Netlify procesa ANTES que este fichero. Por eso se definen como `routeRules`
# en nuxt.config.ts (nitro los escribe en _redirects ANTES del catch-all) y la
# semilla se guarda en seed/ (no en public/) para que no haya un fichero estático
# del mismo nombre que las sombree. Detalle: nota en nuxt.config.ts.

# ── Enlaces cortos de marca (campañas) ───────────────────────────────────────
# Los links cortos (helpmiriam.com/3d…, /donar) NO viven aquí: se definen como
# `routeRules` en nuxt.config.ts. Motivo: `nuxt generate` emite un
# `dist/_redirects` con un catch-all `/*  /404.html  404` que Netlify procesa
# ANTES que netlify.toml, así que interceptaba estos links y devolvía 404 (ni
# `force=true` lo arreglaba: force solo gana a un fichero del mismo nombre, no a
# una regla previa del propio _redirects). Como routeRules, nitro los escribe en
# _redirects ANTES del catch-all y ganan. Convención y tabla: SHORT-LINKS.md.

# ── Cabeceras de seguridad (auditoría 5.5) ───────────────────────────────────
# Sitio de salud + donaciones = la confianza es crítica. Subconjunto SEGURO que
# no rompe nada (Plausible, enlaces a GoFundMe, fuentes auto-alojadas, OG image).
#
# Content-Security-Policy SOLO en report-only (R18, 5-nov-2026): el navegador
# avisa en la consola de lo que bloquearía, pero no bloquea nada. No hay
# report-uri, así que los avisos no salen de la consola de quien visita.
# Orígenes inventariados en el build (grep de .output/public) y con un rastreo
# en Chrome de las 86 páginas generadas sirviendo esta misma cabecera:
#   · cloud.umami.is (script) y gateway.umami.is (envío): inferido del código
#     de script.js; en local no envía nada (data-domains).
#   · plausible.io (envío): inferido de @nuxtjs/plausible (ignoredHostnames).
#   · challenges.cloudflare.com (Turnstile, script + iframe): del código.
#   · alphafold.ebi.ac.uk y api.iconify.design (fetch): del código; solo con
#     interacción, el rastreo no los ve.
#   · btp-laminillas-visor.s3.fr-par.scw.cloud (teselas de /laminillas): visto.
#   · blob: en connect y worker (explorador célula a célula): visto.
#   · 'wasm-unsafe-eval': visto (el explorador célula a célula compila wasm;
#     sin él el rastreo avisa en /celula-a-celula/explorar). Nuxt Content usa
#     además sqlite-wasm en un worker, que el rastreo no ve por dentro.
#   · 'unsafe-inline' en script y style: los scripts del payload de Nuxt y los
#     estilos en línea de Vue. Quitarlo exige hashes o nonces.
# ANTES DE FORZARLA (pasar a Content-Security-Policy) hay que resolver lo que
# este informe dejaría roto: el explorador usa eval (lo vio el rastreo en
# /celula-a-celula/explorar) y loaders.gl puede pedir unpkg.com en un worker
# (sin verificar). No se arregla con otra regla por ruta: dos CSP sobre la
# misma página se aplican las dos y manda la más estricta.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cloud.umami.is https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://btp-laminillas-visor.s3.fr-par.scw.cloud; font-src 'self' data:; connect-src 'self' blob: https://gateway.umami.is https://plausible.io https://alphafold.ebi.ac.uk https://api.iconify.design; worker-src 'self' blob:; frame-src https://challenges.cloudflare.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"

[[headers]]
  for = "/donations.json"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"

# ── Enlaces cortos (vanity) ──────────────────────────────────────────────────
# Viven en routeRules de Nuxt (ver SHORT-LINKS.md): el _redirects generado se
# procesa ANTES que este toml, así que aquí solo quedan funciones y cabeceras.
