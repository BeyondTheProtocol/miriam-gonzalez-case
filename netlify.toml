[build]
  command = "npm_config_build_from_source=true pnpm rebuild better-sqlite3 && pnpm generate"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"

# ── Datos en vivo ────────────────────────────────────────────────────────────
# El total y la lista de donantes (estrellas + tabla) se sirven desde funciones
# que consultan GoFundMe al vuelo y se cachean en la CDN (no hace falta redeploy).
# La semilla generada en build (public/*.json) se incluye en el bundle de las
# funciones como fallback por si GoFundMe no responde.
[functions]
  included_files = ["public/fundraiser.json", "public/donations.json"]

# /fundraiser.json y /donations.json apuntan a las funciones (force gana al
# fichero estático del mismo nombre). El cliente sigue pidiendo las mismas URLs.
[[redirects]]
  from = "/fundraiser.json"
  to = "/.netlify/functions/fundraiser"
  status = 200
  force = true

[[redirects]]
  from = "/donations.json"
  to = "/.netlify/functions/donations"
  status = 200
  force = true

# ── Enlaces cortos de marca (campañas) ───────────────────────────────────────
# Links cortos en NUESTRO dominio (helpmiriam.com/3d…) que redirigen al destino
# real con UTM, para repartir en redes y medir el canal en Umami. 302 (temporal)
# = se pueden repuntar/re-etiquetar sin caché permanente. Convención y cómo
# añadir nuevos: SHORT-LINKS.md.
#
# Campaña «lanzamiento-herramienta» — mapa 3D de metástasis:
[[redirects]]
  from = "/3d"
  to = "/mapa-metastasis?utm_source=short&utm_medium=link&utm_campaign=lanzamiento-herramienta"
  status = 302

[[redirects]]
  from = "/3d-x"
  to = "/mapa-metastasis?utm_source=twitter&utm_medium=post&utm_campaign=lanzamiento-herramienta"
  status = 302

[[redirects]]
  from = "/3d-in"
  to = "/mapa-metastasis?utm_source=linkedin&utm_medium=post&utm_campaign=lanzamiento-herramienta"
  status = 302

[[redirects]]
  from = "/3d-ig"
  to = "/mapa-metastasis?utm_source=instagram&utm_medium=bio&utm_campaign=lanzamiento-herramienta"
  status = 302

# ── Cabeceras de seguridad (auditoría 5.5) ───────────────────────────────────
# Sitio de salud + donaciones = la confianza es crítica. Subconjunto SEGURO que
# no rompe nada (Plausible, enlaces a GoFundMe, fuentes auto-alojadas, OG image).
# NO se incluye una Content-Security-Policy estricta a propósito: una CSP mal
# afinada bloquearía esos recursos. Queda como mejora futura (probar en
# report-only antes de forzarla).
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), browsing-topics=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/donations.json"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
