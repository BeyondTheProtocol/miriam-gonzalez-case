<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Informe del caso · las dos caras del tumor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#faf6f0; --card:#f5efe6; --berenjena:#2d1b3d; --tinta:#3a3340;
  --miriam:#9d44ab; --coral:#bb4128; --amber:#c9921e; --bone:#ece9df; --bonest:#bdb9ab;
  --border:rgba(45,27,61,.12); --border2:rgba(45,27,61,.22);
  --serif:Fraunces,Georgia,"Times New Roman",serif; --body:"Source Sans 3",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,monospace; --hand:"Caveat","Bradley Hand",cursive;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--berenjena);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 90px}
h1,h2,h3{font-family:var(--serif);letter-spacing:-.02em;line-height:1.12;font-weight:600}
h1{font-size:clamp(28px,5vw,46px);margin:0 0 10px}
h2{font-size:26px;margin:0 0 10px}
h3{font-size:20px;margin:0}
.sub{font-size:17px;color:var(--tinta);max-width:780px;margin:0 0 4px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--miriam);font-weight:600}
.badge{display:inline-block;background:#e8d4ed;color:#5a2466;font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:5px 12px;border-radius:999px;margin-bottom:14px}

/* sticky top bar */
.topbar{position:sticky;top:0;z-index:30;background:rgba(250,246,240,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);margin-bottom:8px}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-weight:600;font-size:15px;color:var(--berenjena);margin-right:auto;display:flex;align-items:center;gap:9px}
.brand .dot{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--miriam),#5a2466)}
.seg{display:flex;gap:0;border:1px solid var(--border2);border-radius:999px;overflow:hidden;background:transparent}
.seg button{font:inherit;font-size:13px;padding:6px 14px;border:0;background:transparent;color:var(--tinta);cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--berenjena);color:var(--cream)}
.seg.lens button[aria-pressed="true"]{background:var(--miriam)}
.seg .ic{font-size:13px}

header.hero{padding:30px 0 0}
section.blk{margin:54px 0 0;scroll-margin-top:64px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px}
.disc{background:#fbf0df;color:#7a4a12;border:1px solid #efb27a;border-radius:14px;padding:12px 16px;font-size:14px;margin:18px 0 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.muted{color:var(--tinta);font-size:14px}
.small{font-size:13px} .xs{font-size:11px;color:var(--tinta)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--border);vertical-align:middle}
th{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--tinta);background:#efe8dd}
tr.row{cursor:pointer} tr.row:hover td{background:rgba(157,68,171,.05)} tr.sel td{background:rgba(157,68,171,.1)}
.tcard{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.num{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
.pill{display:inline-block;font-size:12px;padding:3px 11px;border-radius:999px;font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.filters button{font:inherit;font-size:13px;padding:6px 13px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--tinta);cursor:pointer;display:flex;align-items:center;gap:7px}
.filters button[aria-pressed="true"]{background:var(--berenjena);color:var(--cream);border-color:var(--berenjena)}
.sw{width:10px;height:10px;border-radius:50%}
.stage{display:grid;grid-template-columns:380px 1fr;gap:32px;align-items:start}
.skel{position:sticky;top:70px}
figure{margin:0} img.scan{display:block;border-radius:10px;background:#000}
details.tech{margin-top:8px;border-top:1px solid var(--border);padding-top:10px}
details.tech>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--miriam);list-style:none}
details.tech>summary::-webkit-details-marker{display:none}
details.tech>summary::before{content:"\25b8 ";}
details.tech[open]>summary::before{content:"\25be ";}
.bar{height:12px;border-radius:7px;overflow:hidden;display:flex;background:rgba(45,27,61,.06)}
.foot{color:#908e85;font-size:12px;margin-top:40px;border-top:1px solid var(--border);padding-top:16px}
svg circle.les{cursor:pointer;transition:all .15s}

/* hand-drawn cell */
.cellwrap{background:#fbf7f1;border:1.5px solid var(--border);border-radius:20px;padding:8px 8px 4px;position:relative;overflow:hidden}
.cellwrap::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(45,27,61,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(45,27,61,.04) 1px,transparent 1px);background-size:24px 24px;pointer-events:none}
#cellsvg{display:block;width:100%;max-width:640px;height:auto;margin:0 auto;position:relative}
.hand{font-family:var(--hand)}
.cell-hd{font-family:var(--hand);font-weight:700}
.celllegend{display:grid;grid-template-columns:1fr 1fr;gap:7px 20px;max-width:660px;margin:14px auto 4px;padding:0 6px}
.cl-item{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--tinta);line-height:1.3}
.cl-g{width:26px;height:20px;flex-shrink:0}
@media(max-width:560px){.celllegend{grid-template-columns:1fr}}

/* reveal */
@media (prefers-reduced-motion:no-preference){
 .rv{opacity:0;animation:rvf .7s ease forwards}
 .rv1{animation-delay:.15s}.rv2{animation-delay:.5s}.rv3{animation-delay:.85s}.rv4{animation-delay:1.15s}
 #cellsvg .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease forwards}
}
@keyframes rvf{to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}

/* lens: plain vs clinical */
.pro-only{display:none}
body.lens-pro .pro-only{display:block}
body.lens-pro table .pro-only{display:table-cell}
.pat-hint{display:block} body.lens-pro .pat-hint{display:none}

/* three reads */
.reads td:first-child{font-weight:600}
.reads .vh{background:rgba(157,68,171,.06)}
.reads th.vh{background:#ead7ef;color:#5a2466}

/* timeline */
.tl{position:relative;margin-top:18px;padding-left:26px}
.tl::before{content:"";position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:linear-gradient(var(--miriam),var(--amber),var(--coral))}
.tl-i{position:relative;margin:0 0 20px}
.tl-i::before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--cream);border:2.5px solid var(--miriam)}
.tl-i.hl::before{background:var(--miriam)}
.tl-d{font-family:var(--mono);font-size:11px;color:var(--miriam);font-weight:600;letter-spacing:.03em}
.tl-t{font-weight:700;font-size:15px;margin:1px 0 2px}
.tl-x{font-size:13.5px;color:var(--tinta)}

@media(max-width:860px){.stage{grid-template-columns:1fr}.skel{position:static}.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body class="lens-pat">

<div class="topbar">
  <div class="topbar-in">
    <span class="brand"><span class="dot"></span><span id="t-brand"></span></span>
    <div class="seg lens" role="group" aria-label="vista">
      <button id="b-pat" onclick="setLens('pat')" aria-pressed="true"><span class="ic">&#9788;</span><span id="t-lpat"></span></button>
      <button id="b-pro" onclick="setLens('pro')" aria-pressed="false"><span class="ic">&#9877;</span><span id="t-lpro"></span></button>
    </div>
    <div class="seg" role="group" aria-label="idioma">
      <button id="b-es" onclick="setLang('es')" aria-pressed="true">ES</button>
      <button id="b-en" onclick="setLang('en')" aria-pressed="false">EN</button>
    </div>
  </div>
</div>

<div class="wrap">
  <header class="hero">
    <span class="badge" id="t-badge"></span>
    <h1 id="t-title"></h1>
    <p class="sub" id="t-sub"></p>
    <div class="disc" id="t-disc"></div>
  </header>

  <!-- A · drawn two faces -->
  <section class="blk" id="sec-faces">
    <span class="eyebrow" id="t-why"></span>
    <h2 id="t-faces-h" style="margin-top:6px"></h2>
    <p class="sub" id="t-faces-p"></p>
    <div class="cellwrap rv" style="margin-top:16px">
      <svg id="cellsvg" viewBox="0 0 500 300" role="img" aria-labelledby="cell-cap"></svg>
    </div>
    <div class="celllegend" id="celllegend"></div>
    <p class="xs hand" id="cell-cap" style="text-align:center;font-size:15px;margin:6px auto 0"></p>
  </section>

  <!-- B · three reads -->
  <section class="blk" id="sec-reads">
    <span class="eyebrow" id="t-rd-eye"></span>
    <h2 id="t-rd-h" style="margin-top:6px"></h2>

    <p class="xs" id="t-rd-note" style="margin-top:10px"></p>
    <p class="xs" style="font-family:var(--mono);margin-top:6px" id="t-rd-src"></p>

    <div class="pro-only" style="margin-top:18px">
      <h3 id="t-mol-h" style="font-size:17px;margin-bottom:4px"></h3>
      <p class="xs" id="t-mol-p" style="margin:0 0 10px"></p>
      <div class="tcard" style="overflow-x:auto"><table id="moltbl"></table></div>
    </div>
  </section>

  <!-- C · two tracers -->
  <section class="blk" id="sec-trz">
    <span class="eyebrow" id="t-trz-eye"></span>
    <h2 id="t-trz-h" style="margin-top:6px"></h2>
    <div class="grid2" style="margin-top:12px">
      <div class="card" style="border-left:4px solid var(--miriam)"><p style="font-weight:700;color:var(--miriam);margin:0 0 4px">&#8312;&#8312;Ga-DOTATOC &mdash; <span id="t-trz1t"></span></p><p class="muted" id="t-trz1"></p></div>
      <div class="card" style="border-left:4px solid var(--coral)"><p style="font-weight:700;color:var(--coral);margin:0 0 4px">&#185;&#8312;F-FDG &mdash; <span id="t-trz2t"></span></p><p class="muted" id="t-trz2"></p></div>
    </div>
  </section>

  <!-- D · MIP images -->
  <section class="blk" id="sec-mip">
    <h2 id="t-mip-h"></h2>
    <p class="sub" id="t-mip-p"></p>

      <figure class="card" style="padding:12px"><img class="scan" id="img-galmip" style="width:100%" alt=""><figcaption style="text-align:center;font-size:13px;font-weight:600;color:var(--miriam);margin-top:8px">&#8312;&#8312;Ga-DOTATOC &middot; <span id="t-rec"></span></figcaption></figure>
      <figure class="card" style="padding:12px"><img class="scan" id="img-fdgmip" style="width:100%" alt=""><figcaption style="text-align:center;font-size:13px;font-weight:600;color:var(--coral);margin-top:8px">&#185;&#8312;F-FDG &middot; <span id="t-sug"></span></figcaption></figure>
    </div>
  </section>

  <!-- E · interactive map -->
  <section class="blk" id="sec-map">
    <h2 id="t-map-h"></h2>
    <p class="sub" id="t-map-p"></p>
    <div class="grid4" style="margin:18px 0">
      <div class="card" style="padding:16px"><div style="font-family:var(--serif);font-size:30px" id="c-total"></div><div class="xs" id="c-total-l"></div></div>
      <div class="card" style="padding:16px"><div style="font-family:var(--serif);font-size:30px;color:var(--miriam)" id="c-ne"></div><div class="xs" id="c-ne-l"></div></div>
      <div class="card" style="padding:16px"><div style="font-family:var(--serif);font-size:30px;color:#df7a44" id="c-mix"></div><div class="xs" id="c-mix-l"></div></div>
      <div class="card" style="padding:16px"><div style="font-family:var(--serif);font-size:30px;color:var(--coral)" id="c-agg"></div><div class="xs" id="c-agg-l"></div></div>
    </div>
    <div class="filters" id="filters"></div>
    <div class="stage">
      <div class="card skel" style="padding:16px">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--tinta);padding:0 2px 4px"><span id="t-bodyR"></span><span id="t-bodyL"></span></div>
        <svg viewBox="0 0 440 700" style="width:100%" id="svgmap" role="img"></svg>
        <div style="margin-top:12px;padding:0 2px">
          <div style="height:10px;border-radius:6px;background:linear-gradient(90deg,#9d44ab,#8a5bb3,#c9921e,#df7a44,#bb4128)"></div>
          <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--tinta);margin-top:4px"><span id="t-legNE"></span><span id="t-legAGG"></span></div>
        </div>
      </div>
      <div class="card" id="detail"></div>
    </div>
  </section>

  <!-- F · spine -->
  <section class="blk" id="sec-spine">
    <h2 id="t-sp-h"></h2>
    <p class="sub" id="t-sp-p"></p>
    <div class="grid2" style="max-width:520px;margin-top:14px">
      <figure class="card" style="padding:12px"><img class="scan" id="img-galspine" style="width:100%" alt=""><figcaption style="text-align:center;font-size:13px;font-weight:600;color:var(--miriam);margin-top:8px">&#8312;&#8312;Ga-DOTATOC</figcaption></figure>
      <figure class="card" style="padding:12px"><img class="scan" id="img-fdgspine" style="width:100%" alt=""><figcaption style="text-align:center;font-size:13px;font-weight:600;color:var(--coral);margin-top:8px">&#185;&#8312;F-FDG</figcaption></figure>
    </div>
  </section>

  <!-- G · measurements table -->
  <section class="blk" id="sec-tbl">
    <h2 id="t-tbl-h"></h2>
    <p class="sub" id="t-tbl-p"></p>
    <div class="tcard" style="margin-top:12px;overflow-x:auto"><table id="bigtbl"></table></div>
  </section>

  <!-- H · timeline -->
  <section class="blk" id="sec-tl">
    <span class="eyebrow" id="t-tl-eye"></span>
    <h2 id="t-tl-h" style="margin-top:6px"></h2>
    <div class="tl" id="tl"></div>
  </section>

  <div class="foot" id="t-foot"></div>
</div>

 disc:['Reúne y visualiza informes propios: PET-CT ¹⁸F-FDG (24/03/2026), PET-CT ⁶⁸Ga-DOTATOC (26/05/2026) e inmunohistoquímica VHIO VH-26-B-17664 (19/05/2026). Las cifras (SUV, receptores, Ki-67) son las de los informes oficiales. No sustituye el criterio del equipo médico ni es consejo médico: las decisiones son suyas.','Gathers and visualises the patient’s own reports: ¹⁸F-FDG PET-CT (24/03/2026), ⁶⁸Ga-DOTATOC PET-CT (26/05/2026) and VHIO immunohistochemistry VH-26-B-17664 (19/05/2026). The figures (SUV, receptors, Ki-67) are from the official reports. It does not replace the medical team’s judgement and is not medical advice: the decisions are theirs.'],

function recY(deg,len,cx,cy,rx,ry){var a=deg*Math.PI/180;var px=cx+Math.cos(a)*rx,py=cy+Math.sin(a)*ry;var nx=Math.cos(a),ny=Math.sin(a);
 var bx=px-nx*2,by=py-ny*2,tx=px+nx*len,ty=py+ny*len,perpx=-ny,perpy=nx;
 return 'M'+bx.toFixed(1)+' '+by.toFixed(1)+' L'+tx.toFixed(1)+' '+ty.toFixed(1)+' M'+tx.toFixed(1)+' '+ty.toFixed(1)+' L'+(tx+perpx*3.4-nx).toFixed(1)+' '+(ty+perpy*3.4-ny).toFixed(1)+' M'+tx.toFixed(1)+' '+ty.toFixed(1)+' L'+(tx-perpx*3.4-nx).toFixed(1)+' '+(ty-perpy*3.4-ny).toFixed(1);}

 if(tr){var tc=(tr.d==='up'||tr.d==='new')?'#bb4128':tr.d==='down'?'#1f5a3a':'#3a3340';h+='<div><span class=xs>'+L(T.trendlab[0],T.trendlab[1])+'</span><br><span style="font-family:var(--mono);color:'+tc+'">'+tr.t+'</span></div>';}
 if(le.scler)h+='<div><span class=xs>'+L(T.morph[0],T.morph[1])+'</span><br><span style="font-family:var(--mono)">'+L(T.blastic[0],T.blastic[1])+'</span></div>';
 if(le.load)h+='<div><span class=xs>'+L(T.loadlab[0],T.loadlab[1])+'</span><br><span style="font-family:var(--mono)">'+L(T.loadyes[0],T.loadyes[1])+'</span></div>';
 h+='</div></details>';
 document.getElementById('detail').innerHTML=h;}
function buildFilters(){var fs=[['all',L('Todas','All'),null],['ne',L('Solo receptor','Receptor-only'),PH.ne.c],['mixNe',L('Mixto · receptor','Mixed · receptor'),PH.mixNe.c],['mixAgg',L('Mixto · FDG','Mixed · FDG'),PH.mixAgg.c],['agg',L('Solo FDG','FDG-only'),PH.agg.c],['load',L('Hueso de carga','Weight-bearing'),'#bb4128']];
 var h='';fs.forEach(function(f){h+='<button onclick="setFilter(\''+f[0]+'\')" aria-pressed="'+(filt===f[0])+'">'+(f[2]?'<span class=sw style="background:'+f[2]+'"></span>':'')+f[1]+'</button>';});
 document.getElementById('filters').innerHTML=h;}
function setFilter(f){filt=f;buildFilters();buildSVG();}
function counts(){var ne=LES.filter(function(l){return l.fdg==null}).length,ag=LES.filter(function(l){return l.dota==null}).length;
 document.getElementById('c-total').textContent=LES.length;document.getElementById('c-ne').textContent=ne;
 document.getElementById('c-mix').textContent=LES.length-ne-ag;document.getElementById('c-agg').textContent=ag;}

/* ===== measurements table ===== */
function dlt(le){if(le.fdg==null||le.prevFdg==null)return '—';var x=le.fdg-le.prevFdg;return (x>0?'+':'')+x.toFixed(1);}
function buildTable(){var i=lang==='en'?1:0;
 var h='<thead><tr><th>#</th><th>'+L('Localización','Location')+'</th><th>'+L('Lado','Side')+'</th><th>Ga SUVmáx</th><th>FDG SUVmáx</th><th>FDG '+L('previo','prior')+'</th><th>Δ FDG</th><th>'+L('Patrón','Pattern')+'</th></tr></thead><tbody>';
 LES.forEach(function(le){var sd=le.side==='R'?L('Dcha','R'):le.side==='L'?L('Izda','L'):L('Centro','Mid');
  h+='<tr class="row'+(selected===le.id?' sel':'')+'" data-id='+le.id+' onclick="sel('+le.id+');document.getElementById(\'sec-map\').scrollIntoView({behavior:\'smooth\',block:\'start\'})">';
  h+='<td><span class=num style="background:'+col(le)+'">'+le.id+'</span></td>';
  h+='<td style="font-weight:600">'+le.level[i]+'</td><td class=xs>'+sd+'</td>';
  h+='<td style="font-family:var(--mono)">'+fmt(le.dota)+'</td><td style="font-family:var(--mono)">'+fmt(le.fdg)+'</td>';
  h+='<td style="font-family:var(--mono);color:#908e85">'+fmt(le.prevFdg)+'</td><td style="font-family:var(--mono)">'+dlt(le)+'</td>';
  h+='<td><span class=pill style="background:'+col(le)+'22;color:'+col(le)+'">'+plabel(le)+'</span></td></tr>';});
 document.getElementById('bigtbl').innerHTML=h+'</tbody>';}
function markRows(){document.querySelectorAll('#bigtbl tr.row').forEach(function(r){r.classList.toggle('sel',+r.getAttribute('data-id')===selected);});}
