name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint:github
      - run: pnpm run test:afirmaciones-clinicas
      # caso.json vive en dos sitios (app/data y public/datos): las dos copias son la misma y la sinaptofisina no se da por verificada.
      - run: pnpm run test:caso-copias
      # Sistema de diseño: ratchet por fichero (scripts/diseno-baseline.json). Un recuento solo puede bajar.
      - run: pnpm run test:diseno
      # pdftotext (poppler-utils) lee los PDF que se descargan de la web; en CI test:dinero-fuente falla si no está.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      # Las cifras de dinero tienen UNA fuente (app/data/dinero.json) y la norma de transparencia se cumple: ninguna cifra en € a mano,
      # el JSON cuadra, la tarjeta de la campaña no lleva objetivo ni barra y las frases retiradas no vuelven.
      - run: pnpm run test:dinero-fuente
