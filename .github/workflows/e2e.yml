name: E2E

# Tests de navegador contra el build ESTÁTICO, que es lo que sirve Netlify.
# Existen porque hay fallos que solo se ven con la página prerenderizada y no
# con `nuxt dev` (#186 se dio por arreglado así y seguía roto; lo cerró #188).

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  ciencia-nivel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22 # la de Netlify (netlify.toml)
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Si un test muere a medias no queda ni Chrome ni su perfil (no necesita build).
      - run: pnpm test:navegador-cdp-limpieza

      # `nuxt generate` a secas y no `pnpm generate`: este último antes pide los
      # datos a GoFundMe, y el test no los necesita (evita llamarles en cada PR).
      - run: pnpm exec nuxt generate

      - run: pnpm test:ciencia-nivel

      # /ciencia como una sola capa profesional (T2c): el estado se lee de caso.json, los textos clínicos corregidos son los literales del
      # comité médico, las seis deudas del cotejo no vuelven en ninguna página, y /datos y la Cronología recogen lo que salió de /ciencia.
      - run: pnpm test:ciencia-pro

      # /datos: cada cifra que pinta «la película del caso» (y las de cabecera de la página) es la
      # de caso.json, en cada fecha con análisis. Una cifra interpolada sería un dato clínico falso.
      - run: pnpm test:cifras-datos

      # /celula-a-celula: salen los 5 bloques aprobados (sin el censo ni rótulo de ejemplo) y cada cifra pintada está en el JSON.
      - run: pnpm test:celula-cifras

      # /celula-a-celula/explorar: cerrado y noindex sin datos reales, sin pedir datos; con ?demo=1, rótulo de ejemplo,
      # aviso del hígado, suelo y n en cada violín, CNV por célula solo en el hueso y vista reducida en el móvil.
      - run: pnpm test:celula-explorador-html

      # Privacidad: ninguna cita FUTURA con día junto a un lugar (acoso activo). Va detrás
      # del build para revisar también lo generado (.output/public), que es lo que se sirve.
      - run: pnpm test:citas-futuras

      # Privacidad: ninguna sigla de muestra (biopsia, bloque, revisión) en lo publicado.
      - run: pnpm test:siglas-muestra

      # Lo que se rompe sin que nadie lo vea: el ancla #lo-ultimo de la cronología, el
      # «hace N días» horneado en el HTML, y un sitemap con URLs que dan 404 o son noindex.
      - run: pnpm test:salud-estatica

      # El pie dice el día del último cambio (último commit en el build), no un mes escrito a mano.
      - run: pnpm test:pie-fecha

      # El sitemap sigue a la puerta del explorador: abierta, es-ES.xml y en-US.xml listan su URL;
      # cerrada, ninguno; y el robots del HTML generado dice lo mismo.
      - run: pnpm test:sitemap-explorador

      # Home, «Elige tu camino»: accesos directos de clínica y single-cell (href reales sin JS, 44 px,
      # ≤ 2 líneas a 1024, la rejilla tesela, el tabulador sigue el DOM, «Ver detalle clínico» aterriza
      # en «De un vistazo» con clic y con carga directa).
      - run: pnpm test:home-caminos

      # Medición de Umami: los nombres de evento de siempre no se renombran; Clic-gofundme hereda el botón de Donar; Scroll,
      # Hero-visto, Campana-visible (una vez por vista, también con la tarjeta que aparece tras montar), Prensa-visible, Idioma y
      # Visor (una vez por visita) llegan de verdad en Chrome; `entrada` viaja en Donar, Clic-gofundme, Contacto-enviado y Puerta,
      # también sin sessionStorage; hay un solo vocabulario de roles de contacto; y la tira de prensa de la home NO manda
      # «Clic-prensa» a mano (lo cuenta el atributo data-umami-event; si no, contaría doble).
      - run: pnpm test:umami-eventos

      # /laminillas: la matriz se pinta sin JS, sin scroll horizontal en móvil, y /biopsia-osea sale con 301 en
      # _redirects sin .html que lo sombree. Las teselas y la sincronía se prueban en local (LAMINILLAS_TESELAS_DIR).
      - run: pnpm test:laminillas-visor

      # AlphaFold en el explorador, en navegador (con el modelo interceptado, sin red): plegado no pide nada, 20 aperturas
      # no matan el WebGL del mapa, «Volver» lo deja plegado, el tema oscuro repinta y a 375 px no hay scroll horizontal.
      - run: pnpm test:alphafold-visor

      # Estos no necesitan el build; van detrás porque el checkout ya está listo.
      - run: pnpm test:short-links
      # /laminillas: contrato del manifest, privacidad (sin siglas de muestra ni términos vetados), orden de filas,
      # paneo por bloque, que una 4.ª columna entra sin tocar código y el alta y el 301 de la ruta.
      - run: pnpm test:laminillas
      # La cronología vive en dos ficheros (timeline.yml y `eventos` de caso.json): que no diverjan.
      - run: pnpm test:cronologia-caso
      # La sala de prensa se mantiene a mano: claves ES/EN en paralelo, citas = set aprobado, sin contador de campaña.
      - run: pnpm test:sala-prensa
      # Caminos de la home: 1-3 accesos, puerta del explorador, claves ES/EN, léxico de las tarjetas profesionales y rejilla.
      - run: pnpm test:caminos
      # La frase de la constelación usa el total real de donantes, no la lista topada a 500.
      - run: pnpm test:donantes-total
      # La puerta de los resultados de /celula-a-celula (verificado + OK de Miriam) y el contrato del JSON publicado.
      - run: pnpm test:celula-puerta
      # Próximos pasos de /celula-a-celula: contrato del JSON (sin fuentes, fechas con día ni lugares) y la barra cuenta solo los hechos.
      - run: pnpm test:celula-pasos
      # Explorador: contrato de public/celula/explorador/ (solo ejemplo o verificado + OK), puerta, muro en la forma y léxico.
      - run: pnpm test:celula-explorador
      # AlphaFold en el detalle del gen del explorador: las diez proteínas con su UniProt cotejado, plegado, y /tres-dianas con 301.
      - run: pnpm test:alphafold
      - run: pnpm test:mapa-focos
      - run: pnpm test:mallas-3d
      - run: pnpm test:esqueleto-huesos
