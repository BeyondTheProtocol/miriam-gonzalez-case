name: Diseño

# Regla R10 del lint de diseño (sistema v3) y test del texto de los componentes base: lo que solo se ve con la página pintada. Corre en Chrome sobre el build
# ESTÁTICO, en 42 rutas a 320, 360, 390, 768 y 1280 px (320 es el reflow de WCAG 1.4.10 y el zoom del 400 % sobre
# 1280), 210 claves en total. Las doce métricas, con su nombre en la baseline: desborde horizontal de la página
# (desborde) y cajas que se salen por la derecha sin que las tape un contenedor más estrecho (desborde_oculto); borde
# del H1 bajo el del logo (h1_borde); texto por debajo de 13 px en el DOM (texto_bajo_suelo) y dentro de un <svg>, a su
# tamaño de pantalla (texto_svg_bajo_suelo); controles de menos de 44 px (objetivos_pequenos) y de menos de 24 dentro de
# un <svg> (objetivos_svg); contraste por debajo de 4,5:1 (contraste); foco de teclado tapado por la cabecera fija
# (foco_tapado); líneas de más de 90 caracteres pintados (linea_larga); sticky que la cabecera tapa al pegarse
# (sticky_tapado); y texto que deja de verse con las cuatro reglas de WCAG 1.4.12 inyectadas (recorte_1412). Más seis
# cinco comprobaciones sin baseline (el visor 3D, .rejilla-par, el cielo de /links, la barra «Lo último» y los <h3>
# legales), más el canario de recorte_1412, que es un paso aparte de este workflow.
# La cabecera de scripts/test-diseno-render.mjs explica cada una y lo que el gate NO mide. Mismo ratchet que test:diseno:
# scripts/diseno-render-baseline.json solo puede bajar.
#
# Las reglas R1 a R9 no necesitan build y corren en lint.yml. Este workflow es APARTE a propósito: el e2e.yml lo
# toca el PR #290 (explorador célula a célula) y no se mezcla.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 5 anchos × 42 rutas (eran 2 × 42). Medido: 17 min 08 s sin recorte_1412 y 17 min 43 s con ella (2-nov-2026).
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22 # la de Netlify (netlify.toml)
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `nuxt generate` a secas, como en e2e.yml: no hace falta pedir los datos a GoFundMe.
      # La clave de PRUEBAS de Cloudflare (documentada: siempre pasa, widget visible) es lo único que hace que el
      # <div> del captcha se pinte: sin ella `useTurnstile().enabled` es false y R10 no veía el widget que
      # ensanchaba /contacto, /expertos y /ciencia a 320 y 360 px. No sale a la red: el test inyecta un doble de
      # `window.turnstile` con las medidas de la documentación (STUB_TURNSTILE).
      - run: pnpm exec nuxt generate
        env:
          NUXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

      # El canario de recorte_1412: siembra siete recortes de verdad (uno por camino del detector, incluida una dentro
      # de un <details> cerrado, que es el camino que mide el texto de los desplegables) y exige que cuente los seis
      # que pierden texto, no el que se desliza, y que vuelva a su recuento al quitarlos. Tarda unos 10 s y
      # tapa un agujero real del ratchet: un detector que se rompiera y empezara a leer 0 saldría como «BAJA: bien» y
      # alguien lo absorbería como una mejora. Va ANTES del ratchet a propósito: si fuera después, la pasada que falla
      # —que es exactamente ese caso— se saltaría este paso y el canario no correría nunca (medido: en la pasada de
      # cosecha, con el ratchet rojo, este paso salió «skipped»). Corre en /mapa-metastasis, que NO está en cero
      # (3 → 10 → 3): así prueba la resta antes/después con hallazgos ya presentes, y no solo contar desde 0.
      - run: pnpm test:diseno-render --canario --rutas /mapa-metastasis --ancho 390

      # TEMPORAL (diagnóstico de esta rama, se quita antes de fusionar): ATRIBUIR y CLASIFICAR el único hallazgo que
      # sube (/celula-a-celula/explorar:320, 12 → 13). En el Mac esa ruta da 5 y en el CI 12, así que no se puede
      # nombrar ni atribuir desde una pasada local, y comparar contra una baseline cosechada en OTRA pasada no
      # distingue «lo causó la apertura» de «esa clave se mueve entre pasadas». Tres variantes en el MISMO runner y
      # sobre el MISMO build:
      #   (i)   tal cual                           → nombra los 13
      #   (ii)  SIN abrir los desplegables         → si también da 13, el +1 no es de la apertura: es la clave moviéndose
      #   (iii) abriendo y SIN inyectar el CSS     → tiene que dar 0, o el hallazgo es artefacto de abrir y no de 1.4.12
      # Las tres con --rutas, así que salen antes del ratchet y no pintan nada en el gate.
      - name: Atribuir y clasificar el hallazgo nuevo del explorador (TEMPORAL)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import io
          s = io.open('scripts/test-diseno-render.mjs', encoding='utf-8').read()
          A = "  const cerrados = raices.flatMap((r) => [...r.querySelectorAll('details')]).filter((d) => !d.open)"
          B = "  document.head.appendChild(estilo)"
          assert s.count(A) == 1, 'ancla cerrados no unica'
          assert s.count(B) == 1, 'ancla estilo no unica'
          io.open('scripts/var-ii.mjs', 'w', encoding='utf-8').write(s.replace(A, "  const cerrados = []"))
          io.open('scripts/var-iii.mjs', 'w', encoding='utf-8').write(s.replace(B, "  void estilo"))
          print('variantes escritas')
          PY
          echo "########## (i) tal cual ##########"
          node scripts/test-diseno-render.mjs --rutas /celula-a-celula/explorar --detalle
          echo "########## (ii) SIN abrir los desplegables ##########"
          node scripts/var-ii.mjs --rutas /celula-a-celula/explorar --detalle
          echo "########## (iii) abriendo y SIN inyectar el CSS (debe dar 0) ##########"
          node scripts/var-iii.mjs --rutas /celula-a-celula/explorar --detalle
          rm -f scripts/var-ii.mjs scripts/var-iii.mjs

      - run: pnpm test:diseno-render


      # El texto que de verdad sale de Dato, Referencia y TarjetaEnlace (espacios que Vue elimina en modo condense). Sin baseline.
      - run: pnpm test:componentes-texto

      # TarjetaEnlace responde al toque: :active forzado a 375 px, con movimiento normal y reducido. Sin baseline.
      - run: pnpm test:tarjeta-activa
